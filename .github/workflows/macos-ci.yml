name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - 'macOS/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    paths:
      - 'macOS/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: macOS

jobs:
  build:
    name: Build (macos-15)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild \
            -scheme MacCleaner \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build

      # The headless smoke test (MACCLEANER_SMOKE_TEST=1) is run locally
      # before pushing — it needs Full Disk Access and SMC/battery hardware
      # that a CI VM lacks, so CI gates on a clean compile only.
