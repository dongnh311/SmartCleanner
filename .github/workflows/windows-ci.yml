name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

defaults:
  run:
    shell: pwsh
    working-directory: Windows/MacCleaner.Win

jobs:
  build:
    name: Build + test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MacCleaner.Win.sln /p:Platform=x64

      - name: Build (Debug)
        run: dotnet build MacCleaner.Win.sln --configuration Debug --no-restore /p:Platform=x64

      - name: Test
        run: dotnet test Tests/Tests.csproj --configuration Debug --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Windows/MacCleaner.Win/Tests/TestResults/*.trx

  publish:
    name: Publish self-contained ${{ matrix.rid }}
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ${{ matrix.rid }}
        run: dotnet publish App/App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:Platform=${{ matrix.platform }} -p:PublishSingleFile=false -o publish/${{ matrix.rid }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCleaner-${{ matrix.rid }}
          path: Windows/MacCleaner.Win/publish/${{ matrix.rid }}/**
          retention-days: 7
